name: Build APK

on:
  push:
    branches:
      - feature/inventario
      - feature/mesas-gestion
      - fix/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n

      - run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: lachispa-apk-arm64
          path: |
            build/app/outputs/flutter-apk/*arm64*.apk
            build/app/outputs/flutter-apk/lachispapos*arm64*.apk
          if-no-files-found: error
